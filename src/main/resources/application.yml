spring:
  application:
    name: jackpot-service

  datasource:
    url: jdbc:h2:mem:jackpotdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: jackpot-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.sporty.jackpot.api.dto"

jackpot:
  defaults:
    fixed-jackpot:
      initial-pool: 1000.00
      contribution-percentage: 5.0       # 5% of bet amount
      reward-fixed-chance-percentage: 10.0 # 10% chance of winning
    variable-jackpot:
      initial-pool: 5000.00
      contribution-initial-percentage: 10.0  # starts at 10%
      contribution-decay-rate: 0.01          # decreases 1% per 1000 pool increase
      reward-pool-limit: 50000.00            # 100% chance when pool hits this
